# KNOWN RISK — icon assets (handled in-workflow, see the step below):
# the 6 template PNGs in native/assets/ (icon, splash, favicon,
# adaptive foreground/background/monochrome) are NOT on the GitHub
# branch — the push tool is text-only, and native/README.md says so
# ("The default Expo template images ... are not included here").
# app.json points at them, and Expo prebuild is strict about missing
# icon/splash assets, so the workflow generates plain deep-teal
# placeholder PNGs for any that are missing (pure Python, no Pillow).
# The APK will install and run fine; the icon will just be a plain
# teal square until Affan adds a real icon. Local template PNGs exist
# at ~/workspace/ahdora/native/assets/ (icon 1024x1024) if a real icon
# is ever wanted — they cannot be uploaded from this VM through his
# browser, so the placeholder route is the practical one.
#
# How to use:
# 1. Add this file as .github/workflows/build-native-apk.yml on the
#    native-app branch. NOTE (AGENTS.md lesson): the GitHub App snapshot
#    push fails 403 on .github/workflows/* files (needs separate
#    Workflows permission) — so add it via the GitHub web UI in his
#    browser (his Chrome, where his GitHub login is), NOT push_files.
# 2. Actions tab > "Build native APK (debug)" > Run workflow.
#    ~10-20 min later, download "ahdora-debug-apk" from that run and
#    install it on his phone (same as the old Capacitor debug APK).
#    It is a DEBUG build: signed with the auto debug keystore, fine for
#    testing, not for Play Store. No secrets are used anywhere.

name: Build native APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [native-app]
    paths:
      - 'native/**'
      - '.github/workflows/build-native-apk.yml'

jobs:
  build:
    name: Native debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: native
        run: npm ci

      - name: Typecheck
        working-directory: native
        run: npx tsc --noEmit

      - name: Generate placeholder icon assets if missing
        working-directory: native
        # The 6 template PNGs were never pushed (text-only push tool).
        # app.json references them, so create plain deep-teal PNGs for
        # any that are missing — pure Python stdlib, no Pillow needed.
        run: |
          python3 - <<'EOF'
          import os, struct, zlib
          def solid_png(path, w, h, rgb=(13, 92, 92)):
              def chunk(t, data):
                  c = t + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw))
              png += chunk(b'IEND', b'')
              open(path, 'wb').write(png)
          wanted = {
              'assets/icon.png': 1024,
              'assets/splash-icon.png': 1024,
              'assets/android-icon-foreground.png': 512,
              'assets/android-icon-background.png': 512,
              'assets/android-icon-monochrome.png': 512,
              'assets/favicon.png': 48,
          }
          os.makedirs('assets', exist_ok=True)
          for path, size in wanted.items():
              if not os.path.exists(path):
                  solid_png(path, size, size)
                  print(f'created placeholder {path} ({size}x{size})')
              else:
                  print(f'kept existing {path}')
          EOF
          ls -la assets/

      - name: Generate Android project (prebuild)
        working-directory: native
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: native/android
        # --no-daemon: the VM's Gradle daemon dies with Broken pipe;
        # a fresh runner + no-daemon avoids that whole failure mode.
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ahdora-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
